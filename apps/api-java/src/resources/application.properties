server.port=8080

# H2 (MVP)
spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.datasource.url=jdbc:h2:file:./.local/h2/efm;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Storage
file.storage.root=./data

# Optional: property-based master key (prefer ENV APP_MASTER_KEY)
# app.master-key=
# Logging
logging.level.org.springframework=INFO
logging.level.com.kc.encrypted.efm=DEBUG

# --- S3 / MinIO ---
s3.enabled=true
s3.endpoint=http://localhost:9000
s3.accessKey=efmadmin
s3.secretKey=efmadmin123
s3.region=us-east-1
s3.bucket=efm-blobs